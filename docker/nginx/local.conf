map $http_upgrade $sanas_connection {
    default upgrade;
    '' close;
}

# WebSocket URL 中可能有访问令牌，访问日志只记录路径，不记录查询参数。
log_format sanas '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 50m;
    access_log /var/log/nginx/access.log sanas;
    add_header X-Content-Type-Options nosniff always;

    location = / { return 302 /web/; }
    location = /web { return 302 /web/; }
    location = /web/index.html {
        add_header Cache-Control "no-store";
    }
    location /web/ {
        try_files $uri $uri/ /web/index.html;
    }
    location /api/v1/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sanas_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location / { return 404; }
}
